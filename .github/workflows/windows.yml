name: Windows verification

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  schedule:
    - cron: '23 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: physics-sim-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: vcpkg.json
      - name: Configure and build
        shell: pwsh
        run: .\scripts\build.ps1
      - name: Tracking and hygiene
        shell: pwsh
        run: |
          $fullTree = $env:GITHUB_EVENT_NAME -in @('schedule', 'workflow_dispatch') -or $env:GITHUB_REF -like 'refs/tags/*'
          if ($fullTree) {
            .\scripts\check-hygiene.ps1 -All
          } else {
            .\scripts\check-hygiene.ps1
          }
          .\scripts\test-hygiene.ps1
      - name: Release publication dry-run tests
        if: hashFiles('scripts/test-release-publication.ps1') != ''
        shell: pwsh
        run: .\scripts\test-release-publication.ps1
      - name: Standard pull-request verification
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: .\scripts\test.ps1 -Tier Standard
      - name: Standard main verification
        if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: .\scripts\test.ps1 -Tier Standard
      - name: Full verification
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: .\scripts\verify-all.ps1
      - name: Package prerelease
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: .\scripts\package-release.ps1
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: physics-sim-verification-${{ github.run_id }}
          path: |
            build/windows-x64/*.log
            build/windows-x64/clang-tidy/**
            build/windows-x64/fluid-quality-suite/**
            build/windows-x64/lab-smoke/**
            dist/*.zip*
          if-no-files-found: ignore

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: physics-sim-verification-${{ github.run_id }}
          path: release-artifacts
      - name: Publish verified release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: .\scripts\publish-release.ps1 -ArtifactRoot release-artifacts -ExpectedTag $env:GITHUB_REF_NAME
