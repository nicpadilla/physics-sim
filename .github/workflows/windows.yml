# Re-run after dynamic packaged-acceptance path fix.
name: Full version and package verification

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: full-version-package-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.head_ref == 'codex/single-source-version-packaging'
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: vcpkg.json
      - name: Build
        shell: pwsh
        run: .\scripts\build.ps1
      - name: Hygiene and version tests
        shell: pwsh
        run: |
          .\scripts\check-hygiene.ps1
          .\scripts\test-version.ps1
      - name: Full verification
        shell: pwsh
        run: .\scripts\verify-all.ps1
      - name: Package from verified Release build
        shell: pwsh
        run: .\scripts\package-release.ps1 -SkipBuild
      - name: Upload package evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: physics-sim-full-version-package-${{ github.run_id }}
          path: |
            build/windows-x64/*.log
            build/windows-x64/fluid-quality-suite/**
            dist/*.zip*
            dist/*/release-manifest.json
          if-no-files-found: ignore
