name: Runtime reset branch verification

on:
  push:
    branches: [codex/clean-scene-runtime-reset]

permissions:
  contents: read

concurrency:
  group: runtime-reset-branch-verification
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: vcpkg.json
      - name: Configure and build
        shell: pwsh
        run: .\scripts\build.ps1
      - name: Hygiene
        shell: pwsh
        run: .\scripts\check-hygiene.ps1
      - name: Standard verification
        shell: pwsh
        run: .\scripts\test.ps1 -Tier Standard
      - name: Challenge verification
        shell: pwsh
        run: .\scripts\verify-challenges.ps1 -Configuration Debug -SkipBuild
      - name: Replay verification
        shell: pwsh
        run: .\scripts\verify-replay-suite.ps1
